name: Isolated Rust runtime candidate

on:
  push:
    branches: [fix/cli-install-safety-20261028]
    paths:
      - hooks/rust_runtime_adapter.cjs
      - hooks/rust_runtime_dispatch.cjs
      - tests/*candidate*
      - tests/test_rust_adapter.cjs
      - .github/workflows/rust-runtime-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-runtime:
    name: Candidate adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node_os: linux
            arch: x64
          - os: windows-2022
            node_os: win32
            arch: x64
          - os: macos-14
            node_os: darwin
            arch: arm64
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: full-stack-plugins/codeguard
          ref: cc7b907f6ba22b61bc19e5371df31d03ee72f452
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Record actual platform and tools
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          rustc -Vv
          cargo -V
          cmake --version
          node -e "console.log(process.platform, process.arch); if (process.platform !== '${{ matrix.node_os }}' || process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - name: Candidate archive negative contracts
        run: python -m unittest discover -s tests -p test_candidate_runtime.py -v
      - name: Candidate transport and default runtime contracts
        run: node --test tests/test_rust_adapter.cjs tests/test_rust_runtime.cjs tests/test_rust_lifecycle.cjs
      - name: Build exact source, offline install, and invoke plugin adapter
        run: python tests/run_candidate_pipeline.py ../engine
      - name: Preserve candidate evidence, without publishing a runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-candidate-${{ matrix.os }}-${{ github.sha }}
          path: plugin/candidate-evidence/
          if-no-files-found: warn
