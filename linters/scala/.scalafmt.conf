# codestyle-check (codelint): Scala scalafmt 推荐配置
# 使用方法：拷贝到项目根目录 .scalafmt.conf：
#   coursier install scalafmt
#   scalafmt              # 自动格式化
#   scalafmt --check      # CI 检查（codelint 钩子默认调用）
# 静态分析另配 scalafix。

version = "3.8.1"

runner.dialect = scala213

maxColumn = 120

indent:
  main = 2
  callSite = 2

align:
  preset = most

docstrings:
  style = Asterisk
  oneline = unfold

rewrite:
  rules: [SortImports, RedundantBraces, RedundantParens]
  sortModifiers: false

project:
  excludePaths:
    - "target/"
    - ".metals/"
