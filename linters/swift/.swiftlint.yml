# codestyle-check (codelint): SwiftLint 推荐配置
# 使用方法：拷贝到项目根目录 .swiftlint.yml（与 .xcodeproj 同级）：
#   brew install swiftlint
#   swiftlint          # 检查
#   swiftlint --fix    # 自动修复

included:
  - Sources
  - Tests

excluded:
  - .build
  - Packages
  - DerivedData

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - sorted_imports
  - toggle_bool

line_length:
  warning: 160
  error: 200

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - at

# 测试文件放宽
force_cast: warning
force_try: warning
